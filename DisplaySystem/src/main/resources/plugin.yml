name: DisplaySystem
version: '1.0.0'
main: com.minezone.display.DisplaySystemPlugin
api-version: '1.21'
author: MineZone
description: Displays, hologramas e rankings interativos do lobby do MineZone.
softdepend: [AuthSystem, RankSystem, EggSystem, EconomySystem, ClaSystem]

commands:
  displayadmin:
    description: Administra os displays do lobby.
    usage: /displayadmin <set|reset|reload> [rtp|continuar|top_ovo|top_dinheiro|top_clas]
